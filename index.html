<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F4EFE2">
<style>
  :root {
    --paper: #F4EFE2;
    --paper-edge: #EAE2CE;
    --rule: rgba(90, 60, 40, 0.14);
    --margin-rule: #B5564E;
    --ink: #2B2A26;
    --ink-faded: #8B8578;
    --accent: #3F6E63;
    --accent-soft: rgba(63, 110, 99, 0.14);
    --room: #DDD5C0;
  }

  html.dark {
    --rule: rgba(236, 231, 218, 0.14);
    --margin-rule: #E08B82;
    --ink: #ECE7DA;
    --ink-faded: #948E82;
    --accent: #6FB3A2;
    --accent-soft: rgba(111, 179, 162, 0.2);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--room);
    transition: background 0.25s ease;
  }

  body {
    font-family: "Courier New", "Courier", ui-monospace, monospace;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 760px;
    background: var(--paper);
    box-shadow: 0 1px 0 var(--paper-edge), 0 18px 40px rgba(40, 30, 10, 0.18);
    padding: 44px 34px 34px 68px;
    min-height: 640px;
  }

  .margin-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 46px;
    width: 1px;
    background: var(--margin-rule);
    opacity: 0.55;
  }

  header {
    margin-bottom: 22px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0 0 4px 0;
  }

  .date {
    font-size: 13px;
    color: var(--ink-faded);
  }

  .theme-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .theme-label {
    font-size: 11px;
    color: var(--ink-faded);
  }

  .appearance-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }

  .mode-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink-faded);
    cursor: pointer;
    padding: 0 0 2px 0;
    border-bottom: 2px solid transparent;
  }

  .mode-btn.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .undo-bar {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 16px;
    background: var(--ink);
    color: var(--paper);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    z-index: 1200;
  }

  .undo-bar button {
    background: none;
    border: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
  }

  .confetti-piece {
    position: fixed;
    top: -12px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    z-index: 1300;
    pointer-events: none;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
  }

  @keyframes confetti-fall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0.3;
    }
  }

  .swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.18);
    cursor: pointer;
    padding: 0;
  }

  .swatch.active {
    box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink);
  }

  .swatch-custom {
    width: 16px;
    height: 16px;
    border: none;
    padding: 0;
    background: none;
    cursor: pointer;
  }
  .swatch-custom::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch-custom::-webkit-color-swatch { border-radius: 50%; border: 1px solid rgba(0,0,0,0.18); }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.2);
    flex: none;
  }

  .legend-input {
    border: none;
    background: transparent;
    border-bottom: 1px dashed transparent;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink-faded);
    outline: none;
    width: 62px;
  }

  .legend-input:hover, .legend-input:focus {
    border-bottom-color: var(--ink-faded);
  }

  .notify-row {
    margin-top: 10px;
    font-size: 11px;
    color: var(--ink-faded);
  }

  .notify-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .notify-row input[type="checkbox"] {
    cursor: pointer;
  }

  .ruled {
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 37px,
      var(--rule) 37px,
      var(--rule) 38px
    );
  }

  #list {
    list-style: none;
    margin: 0;
    padding: 0;
    min-height: 38px;
  }

  #list li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    height: 38px;
    line-height: 38px;
    position: relative;
  }

  #list li.dragging {
    opacity: 0.35;
  }

  #list li.drag-over-top {
    box-shadow: inset 0 2px 0 var(--accent);
  }

  #list li.drag-over-bottom {
    box-shadow: inset 0 -2px 0 var(--accent);
  }

  .handle {
    flex: none;
    width: 12px;
    height: 38px;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 2px;
    cursor: grab;
    opacity: 0.35;
    transition: opacity 0.12s ease;
    margin-left: -4px;
    touch-action: none;
  }

  .drag-ghost {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    border-radius: 4px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.92;
  }

  #list li:hover .handle { opacity: 0.7; }

  .handle:active { cursor: grabbing; }

  .handle span {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--ink-faded);
  }

  .box {
    flex: none;
    width: 15px;
    height: 15px;
    margin-top: 11px;
    border: 1.5px solid var(--ink);
    cursor: pointer;
    position: relative;
    background: transparent;
  }

  .box svg {
    position: absolute;
    top: -3px;
    left: -3px;
    width: 19px;
    height: 19px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  li.done .box {
    border-color: var(--accent);
  }

  li.done .box svg {
    opacity: 1;
    transform: scale(1);
  }

  .box svg path {
    stroke: var(--accent);
    stroke-width: 2.4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .text {
    flex: 1;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }

  li.done .text {
    color: var(--ink-faded);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faded);
    text-decoration-thickness: 1px;
  }

  .remove {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-faded);
    font-size: 16px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s ease;
    padding: 0 2px;
    margin-top: 8px;
  }

  #list li:hover .remove { opacity: 1; }

  #list li.pinned {
    background: var(--accent-soft);
    border-radius: 4px;
  }

  .pin-btn {
    flex: none;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s ease;
    margin-top: 9px;
    color: var(--ink-faded);
    padding: 0 2px;
  }

  #list li:hover .pin-btn,
  #list li.pinned .pin-btn {
    opacity: 1;
  }

  #list li.pinned .pin-btn {
    color: var(--accent);
  }

  .pin-btn svg {
    width: 14px;
    height: 14px;
    display: block;
  }

  .highlights {
    flex: none;
    display: flex;
    gap: 5px;
    align-items: center;
    opacity: 0;
    transition: opacity 0.12s ease;
    margin-top: 13px;
  }

  #list li:hover .highlights { opacity: 1; }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.2);
    cursor: pointer;
    padding: 0;
  }

  .dot.selected {
    box-shadow: 0 0 0 1.5px var(--paper), 0 0 0 3px var(--ink);
  }

  .dot.clear {
    background: transparent;
    position: relative;
  }
  .dot.clear::before, .dot.clear::after {
    content: '';
    position: absolute;
    left: 1px; right: 1px;
    top: 4px;
    height: 1px;
    background: var(--ink-faded);
  }
  .dot.clear::before { transform: rotate(45deg); }
  .dot.clear::after { transform: rotate(-45deg); }

  .text mark {
    background: var(--hl, transparent);
    color: inherit;
    padding: 1px 3px;
    border-radius: 2px;
  }

  .course-meta {
    flex: none;
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 13px;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .new-row {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 38px;
  }

  .new-row .box {
    border-color: var(--ink-faded);
    border-style: dashed;
  }

  #new-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    height: 38px;
  }

  #new-input::placeholder {
    color: var(--ink-faded);
  }

  #new-due {
    flex: none;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-faded);
    outline: none;
    cursor: pointer;
    width: 108px;
  }

  .due {
    flex: none;
    font-size: 12px;
    color: var(--ink-faded);
    cursor: pointer;
    white-space: nowrap;
    margin-top: 12px;
    border-bottom: 1px dashed transparent;
  }

  .due:hover {
    border-bottom-color: var(--ink-faded);
  }

  .due.overdue {
    color: var(--margin-rule);
  }

  .due-edit {
    flex: none;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    outline: none;
    margin-top: 8px;
  }

  footer {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-faded);
  }

  .footer-status {
    white-space: nowrap;
  }

  #app-version {
    margin-left: 10px;
    font-size: 10px;
    opacity: 0.55;
  }

  .footer-actions {
    display: flex;
    flex-wrap: wrap;
    row-gap: 4px;
  }

  .footer-actions button:not(:last-child)::after {
    content: '·';
    margin: 0 8px;
    color: var(--ink-faded);
  }

  .calendar {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .cal-header .cal-title {
    font-size: 14px;
    font-weight: 700;
  }

  .cal-header button {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    padding: 0 6px;
  }

  .cal-modes {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .cal-mode {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink-faded);
    cursor: pointer;
    padding: 0 0 2px 0;
    border-bottom: 2px solid transparent;
  }

  .cal-mode.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .cal-day.drop-target {
    box-shadow: inset 0 0 0 1.5px var(--accent);
    background: var(--accent-soft);
  }

  .cal-grid.week-mode .cal-day {
    min-height: 120px;
  }

  .cal-weekdays, .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .cal-weekdays {
    font-size: 10px;
    color: var(--ink-faded);
    text-align: center;
    margin-bottom: 4px;
  }

  .cal-grid {
    gap: 2px;
  }

  .cal-day {
    min-height: 56px;
    padding: 3px 4px;
    border-radius: 4px;
    font-size: 10px;
  }

  .cal-day.other-month {
    opacity: 0.32;
  }

  .cal-day.today {
    background: var(--accent-soft);
  }

  .cal-day .day-num {
    font-size: 11px;
    color: var(--ink-faded);
  }

  .cal-day.today .day-num {
    color: var(--accent);
    font-weight: 700;
  }

  .cal-task {
    display: flex;
    align-items: center;
    gap: 3px;
    border-radius: 2px;
    padding: 0 3px;
    margin-top: 2px;
    font-size: 9px;
    line-height: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--accent-soft);
  }

  .cal-task .cal-task-check {
    flex: none;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .cal-task.done {
    opacity: 0.5;
    text-decoration: line-through;
  }

  .cal-event {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--accent-soft);
    border-radius: 2px;
    padding: 0 2px;
    margin-top: 2px;
    font-size: 9px;
    line-height: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-event button {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-faded);
    cursor: pointer;
    font-size: 10px;
    padding: 0 1px;
    line-height: 1;
  }

  .cal-add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }

  .cal-add-row input[type="date"] {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-faded);
    outline: none;
  }

  .cal-add-row input[type="text"] {
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }

  .cal-add-row button {
    flex: none;
    border: none;
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  .import-panel {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  .import-hint {
    font-size: 11px;
    color: var(--ink-faded);
    margin-bottom: 8px;
  }

  #import-text {
    width: 100%;
    resize: vertical;
    border: 1px solid var(--rule);
    background: transparent;
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: var(--ink);
    padding: 8px;
    border-radius: 4px;
    outline: none;
  }

  #import-btn {
    margin-top: 8px;
    border: none;
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  footer button {
    background: none;
    border: none;
    color: var(--ink-faded);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  footer button:hover { color: var(--accent); }

  .empty-note {
    font-size: 13px;
    color: var(--ink-faded);
    font-style: italic;
    padding: 8px 0 0 27px;
    display: none;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="margin-line"></div>
    <header>
      <h1>To‑do</h1>
      <div class="date" id="date"></div>
      <div class="theme-row" id="theme-row">
        <span class="theme-label">page:</span>
      </div>
      <div class="appearance-row" id="appearance-row">
        <span class="theme-label">mode:</span>
        <button id="mode-light" class="mode-btn active">light</button>
        <button id="mode-dark" class="mode-btn">dark</button>
      </div>
      <div class="legend-row" id="legend-row"></div>
      <div class="notify-row">
        <label><input type="checkbox" id="notif-toggle"> notify me when tasks are due</label>
        <span id="push-status" style="font-size:12px;opacity:0.75;margin-left:8px;"></span>
      </div>
    </header>

    <div class="ruled">
      <ul id="list"></ul>
      <div class="new-row">
        <div class="box"></div>
        <input id="new-input" type="text" placeholder="Write something down…" maxlength="140">
        <input id="new-due" type="date" title="Due date">
      </div>
    </div>
    <div class="empty-note" id="empty-note">Nothing on the list yet. Type above and press Enter.</div>

    <footer>
      <div class="footer-status">
        <span id="counter"></span>
        <span id="app-version" title="App version">v16</span>
      </div>
      <div class="footer-actions">
        <button id="sort-color">sort by colour</button>
        <button id="sort-due">sort by due date</button>
        <button id="clear-done">clear completed</button>
        <button id="toggle-calendar">calendar</button>
        <button id="toggle-import">import</button>
      </div>
    </footer>

    <div class="calendar" id="calendar" style="display:none;">
      <div class="cal-header">
        <button id="cal-prev">‹</button>
        <span class="cal-title" id="cal-title"></span>
        <button id="cal-next">›</button>
      </div>
      <div class="cal-modes">
        <button id="cal-mode-month" class="cal-mode active">month</button>
        <button id="cal-mode-week" class="cal-mode">week</button>
      </div>
      <div class="cal-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-add-row">
        <input type="date" id="event-date">
        <input type="text" id="event-text" placeholder="Add an event…" maxlength="60">
        <button id="event-add">add</button>
      </div>
    </div>

    <div class="import-panel" id="import-panel" style="display:none;">
      <div class="import-hint">One task per line: Course | Title | Due date | Weight (course and weight are optional)</div>
      <textarea id="import-text" rows="6" placeholder="ENGG 130 | Assignment 1 | 2026-09-13 | 1%"></textarea>
      <button id="import-btn">Import tasks</button>
    </div>
  </div>

  <div class="undo-bar" id="undo-bar">
    <span id="undo-message"></span>
    <button id="undo-btn">Undo</button>
  </div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

        return data[key] !== undefined ? { key, value: data[key] } : null;
      } catch (e) {
        return localFallback.get(key);
      }
    },
    async set(key, value) {
      // mirror locally too, so the app stays instantly responsive even offline
      localStorage.setItem(key, value);
      await ready;
      if (!docRef) return { key, value };
      try {
        await docRef.set({ [key]: value }, { merge: true });
      } catch (e) {}
      return { key, value };
    }

  function shade(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + percent;
    let g = ((num >> 8) & 0x00FF) + percent;
    let b = (num & 0x0000FF) + percent;
    r = Math.max(Math.min(255, r), 0);
    g = Math.max(Math.min(255, g), 0);
    b = Math.max(Math.min(255, b), 0);
    return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
  }

  // Works even when the site is closed. Needs the site installed to the

  const VAPID_PUBLIC_KEY = 'BDRv_mGOw2gYzHgHYj65rl5suCfeotXhC8SNKFmmsC6mf9rP9ru3_gzoDHj9vGh-k-PMfw9hnZmM4hM4qwZK6so';
  const PUSH_SUBS_KEY = 'todo:push-subscriptions';

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  async function loadPushSubscriptions() {
    try {
      const result = await window.storage.get(PUSH_SUBS_KEY, false);

  async function savePushSubscriptions(subs) {

  async function subscribePush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    const subs = await loadPushSubscriptions();
    if (!subs.some(s => s.endpoint === subJson.endpoint)) {
      subs.push(subJson);
      await savePushSubscriptions(subs);
    }
  }

  async function unsubscribePush() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        const endpoint = sub.endpoint;
        await sub.unsubscribe();
        const subs = (await loadPushSubscriptions()).filter(s => s.endpoint !== endpoint);
        await savePushSubscriptions(subs);
      }
    } catch (e) {}
  }

    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return false;
      return !!(await reg.pushManager.getSubscription());

  function buildDayCell(iso, dayNum, otherMonth, todayStr, tasksByDue, eventsByDate) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if (otherMonth) cell.classList.add('other-month');

  function renderCalendar() {
    if (!calGrid) return;
    if (calendarPanel.style.display === 'none') return; // skip work while hidden
    const todayStr = todayISO();
    // Index tasks/events by date once instead of filtering per day cell.
    const tasksByDue = new Map();
    for (const t of tasks) {
      if (!t.due) continue;
      let arr = tasksByDue.get(t.due);
      if (!arr) { arr = []; tasksByDue.set(t.due, arr); }
      arr.push(t);
    }
    const eventsByDate = new Map();
    for (const ev of events) {
      let arr = eventsByDate.get(ev.date);
      if (!arr) { arr = []; eventsByDate.set(ev.date, arr); }
      arr.push(ev);
    }
    calGrid.innerHTML = '';
    const frag = document.createDocumentFragment();

    if (calMode === 'week') {
      const start = new Date(calAnchor);
      start.setDate(calAnchor.getDate() - calAnchor.getDay());
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const startLabel = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const endLabel = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      calTitle.textContent = startLabel + ' – ' + endLabel;

      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const iso = toIso(d.getFullYear(), d.getMonth(), d.getDate());
        frag.appendChild(buildDayCell(iso, d.getDate(), d.getMonth() !== calAnchor.getMonth(), todayStr, tasksByDue, eventsByDate));
      }
      calGrid.appendChild(frag);
      return;
    }

    const year = calAnchor.getFullYear();
    const month = calAnchor.getMonth();
    const monthStart = new Date(year, month, 1);
    calTitle.textContent = monthStart.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    const startWeekday = monthStart.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
    for (let i = 0; i < totalCells; i++) {
      let cellDay, cellMonth, cellYear, otherMonth;
      if (i < startWeekday) {
        cellDay = daysInPrevMonth - startWeekday + 1 + i;
        cellMonth = month - 1;
        cellYear = year;
        otherMonth = true;
      } else if (i >= startWeekday + daysInMonth) {
        cellDay = i - (startWeekday + daysInMonth) + 1;
        cellMonth = month + 1;
        cellYear = year;
        otherMonth = true;
      } else {
        cellDay = i - startWeekday + 1;
        cellMonth = month;
        cellYear = year;
        otherMonth = false;
      }
      let normMonth = cellMonth, normYear = cellYear;
      if (normMonth < 0) { normMonth = 11; normYear -= 1; }
      if (normMonth > 11) { normMonth = 0; normYear += 1; }
      const iso = toIso(normYear, normMonth, cellDay);
      frag.appendChild(buildDayCell(iso, cellDay, otherMonth, todayStr, tasksByDue, eventsByDate));
    }
    calGrid.appendChild(frag);
  }

        handle._dragCtx = { ghost, target: null, taskId: task.id, li };
        li.classList.add('dragging');
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        handle.addEventListener('pointermove', onDragMove);
        handle.addEventListener('pointerup', onDragEnd);
        handle.addEventListener('pointercancel', onDragEnd);
      });

      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = checkSVG;
      box.addEventListener('click', () => toggleTask(task.id));

      const text = document.createElement('div');
      text.className = 'text';
      const mainSpan = document.createElement(task.highlight ? 'mark' : 'span');
      if (task.highlight) mainSpan.style.setProperty('--hl', task.highlight);
      mainSpan.textContent = task.text;
      text.appendChild(mainSpan);
      const metaParts = [task.course, task.weight].filter(Boolean);
      text.title = task.text + (metaParts.length ? ' — ' + metaParts.join(' · ') : '');

      const courseMeta = document.createElement('div');
      courseMeta.className = 'course-meta';
      if (metaParts.length) {
        courseMeta.textContent = metaParts.join(' · ');
        courseMeta.title = metaParts.join(' · ');
      }

      const highlights = document.createElement('div');
      highlights.className = 'highlights';
      HIGHLIGHT_COLORS.forEach(color => {
        const dot = document.createElement('button');
        dot.className = 'dot' + (task.highlight === color ? ' selected' : '');
        dot.style.background = color;
        dot.title = legendLabel(color) || 'Highlight';
        dot.addEventListener('click', () => setHighlight(task.id, task.highlight === color ? null : color));
        highlights.appendChild(dot);
      });
      const clearDot = document.createElement('button');
      clearDot.className = 'dot clear';
      clearDot.title = 'No highlight';
      clearDot.addEventListener('click', () => setHighlight(task.id, null));
      highlights.appendChild(clearDot);

      const dueHolder = document.createElement('div');
      dueHolder.style.flex = 'none';
      renderDue(dueHolder, task, todayStr);

      const pinBtn = document.createElement('button');
      pinBtn.className = 'pin-btn';
      pinBtn.innerHTML = pinSVG;
      pinBtn.title = task.pinned ? 'Unpin' : 'Pin to top';
      pinBtn.addEventListener('click', () => togglePin(task.id));

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.textContent = '×';
      remove.title = 'Delete';
      remove.addEventListener('click', () => removeTask(task.id));

      li.appendChild(handle);
      li.appendChild(box);
      li.appendChild(text);
      li.appendChild(courseMeta);
      li.appendChild(dueHolder);
      li.appendChild(highlights);
      li.appendChild(pinBtn);
      li.appendChild(remove);
      frag.appendChild(li);
    });
    listEl.appendChild(frag);

    const remaining = tasks.filter(t => !t.done).length;
    counterEl.textContent = tasks.length
      ? (remaining === 0 ? 'all done' : remaining + ' remaining')
      : '';
    emptyNote.style.display = tasks.length ? 'none' : 'block';
    renderCalendar();

    if (tasks.length > 0 && remaining === 0 && prevRemaining !== null && prevRemaining > 0) {
      celebrate();
    }
    prevRemaining = remaining;
  }

  function addTask(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const due = newDueEl.value || null;
    tasks.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), text: trimmed, done: false, due: due });
    newDueEl.value = '';
    render();
    save();
  }

  function parseDateFlexible(str) {
    str = (str || '').trim();
    if (!str) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
    const d = new Date(str);
    if (isNaN(d.getTime())) return null;
    return toIso(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function importTasks(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const addedIds = [];
    let count = 0;
    lines.forEach(line => {
      const parts = line.split('|').map(p => p.trim());
      let course = '', title = '', dueRaw = '', weight = '';
      if (parts.length >= 4) {
        [course, title, dueRaw, weight] = parts;
      } else if (parts.length === 3) {
        [title, dueRaw, weight] = parts;
      } else if (parts.length === 2) {
        [title, dueRaw] = parts;
      } else {
        title = parts[0] || '';
      }
      if (!title) return;
      const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '-' + count;
      tasks.push({
        id,
        text: title,
        done: false,
        due: parseDateFlexible(dueRaw),
        course: course || undefined,
        weight: weight || undefined
      });
      addedIds.push(id);
      count++;
    });
    if (count) {
      render();
      save();
    }
    return addedIds;
  }

  toggleImportBtn.addEventListener('click', () => {
    const showing = importPanel.style.display !== 'none';
    importPanel.style.display = showing ? 'none' : 'block';
  });

  importBtn.addEventListener('click', () => {
    const addedIds = importTasks(importTextEl.value);
    if (addedIds.length) {
      importTextEl.value = '';
      showUndo(addedIds.length === 1 ? '1 task imported' : addedIds.length + ' tasks imported', () => {
        const addedSet = new Set(addedIds);
        tasks = tasks.filter(t => !addedSet.has(t.id));
        render();
        save();
      });
    }
  });

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.done = !t.done;
    render();
    save();
  }

  function removeTask(id) {
    const index = tasks.findIndex(t => t.id === id);
    if (index === -1) return;
    const [removed] = tasks.splice(index, 1);
    render();
    save();
    showUndo('Task deleted', () => {
      tasks.splice(index, 0, removed);
      render();
      save();
    });
  }

  let undoTimeout = null;
  let lastUndo = null;

  function showUndo(message, restoreFn) {
    lastUndo = { restore: restoreFn };
    undoMessageEl.textContent = message;
    undoBar.style.display = 'flex';
    clearTimeout(undoTimeout);
    undoTimeout = setTimeout(hideUndo, 5000);
  }

  function hideUndo() {
    undoBar.style.display = 'none';
    lastUndo = null;
  }

  undoBtn.addEventListener('click', () => {
    if (lastUndo) lastUndo.restore();
    hideUndo();
  });

  function celebrate() {
    const colors = HIGHLIGHT_COLORS.concat(['#3F6E63', '#B5564E']);
    const count = 70;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      piece.style.animationDuration = (2.2 + Math.random() * 1.2) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4200);
    }
  }

  let prevRemaining = null;

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  const formatDueCache = new Map();

  function formatDue(iso) {
    let out = formatDueCache.get(iso);
    if (out === undefined) {
      const [y, m, d] = iso.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      out = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      formatDueCache.set(iso, out);
    }
    return out;
  }

  function renderDue(holder, task, todayStr) {
    if (todayStr === undefined) todayStr = todayISO();
    holder.innerHTML = '';
    if (task.due) {
      const chip = document.createElement('span');
      chip.className = 'due' + (!task.done && task.due < todayStr ? ' overdue' : '');
      chip.textContent = formatDue(task.due);
      chip.title = 'Click to change due date';
      chip.addEventListener('click', () => showDueInput(holder, task));
      holder.appendChild(chip);
    } else {
      const chip = document.createElement('span');
      chip.className = 'due';
      chip.textContent = '+ due';
      chip.title = 'Set a due date';
      chip.addEventListener('click', () => showDueInput(holder, task));
      holder.appendChild(chip);
    }
  }

  function showDueInput(holder, task) {
    holder.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'date';
    input.className = 'due-edit';
    if (task.due) input.value = task.due;
    input.addEventListener('change', () => {
      setDue(task.id, input.value || null);
    });
    input.addEventListener('blur', () => renderDue(holder, task));
    holder.appendChild(input);
    input.focus();
    if (input.showPicker) { try { input.showPicker(); } catch (e) {} }
  }

  function setDue(id, due) {
    const t = tasks.find(t => t.id === id);
    if (t) t.due = due;
    render();
    save();
  }

  function compareByDue(a, b) {
    if (a.due && b.due) return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
    if (a.due && !b.due) return -1;
    if (!a.due && b.due) return 1;
    return 0;
  }

  function sortByDue() {
    tasks.sort(compareByDue);
    render();
    save();
  }

  function sortByColor() {
    const order = [...HIGHLIGHT_COLORS, null];
    tasks.sort((a, b) => {
      const ai = order.indexOf(a.highlight || null);
      const bi = order.indexOf(b.highlight || null);
      if (ai !== bi) return ai - bi;
      return compareByDue(a, b);
    });
    render();
    save();
  }

  function clearDragIndicators() {
    document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    document.querySelectorAll('.cal-day.drop-target').forEach(el => {
      el.classList.remove('drop-target');
    });
  }

  // Shared drag handlers, hoisted out of render() so they aren't recreated
  // for every task on every render. Per-drag state lives on handle._dragCtx.
  function onDragMove(e) {
    const dragCtx = e.currentTarget._dragCtx;
    if (!dragCtx) return;
    dragCtx.ghost.style.left = (e.clientX + 14) + 'px';
    dragCtx.ghost.style.top = (e.clientY + 14) + 'px';
    clearDragIndicators();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) { dragCtx.target = null; return; }
    const overLi = el.closest('#list li');
    if (overLi) {
      const rect = overLi.getBoundingClientRect();
      const isAfter = (e.clientY - rect.top) > rect.height / 2;
      overLi.classList.add(isAfter ? 'drag-over-bottom' : 'drag-over-top');
      dragCtx.target = { type: 'list', id: overLi.dataset.id, after: isAfter };
      return;
    }
    if (el.closest('#list')) {
      dragCtx.target = { type: 'list-end' };
      return;
    }
    const overDay = el.closest('.cal-day');
    if (overDay && overDay.dataset.iso) {
      overDay.classList.add('drop-target');
      dragCtx.target = { type: 'calendar', iso: overDay.dataset.iso };
      return;
    }
    dragCtx.target = null;
  }

  function onDragEnd(e) {
    const handle = e.currentTarget;
    const dragCtx = handle._dragCtx;
    handle._dragCtx = null;
    if (!dragCtx) return;
    const target = dragCtx.target;
    dragCtx.ghost.remove();
    dragCtx.li.classList.remove('dragging');
    clearDragIndicators();
    handle.removeEventListener('pointermove', onDragMove);
    handle.removeEventListener('pointerup', onDragEnd);
    handle.removeEventListener('pointercancel', onDragEnd);
    if (!target) return;
    if (target.type === 'list') reorderTasks(dragCtx.taskId, target.id, target.after);
    else if (target.type === 'list-end') moveTaskToEnd(dragCtx.taskId);
    else if (target.type === 'calendar') setDue(dragCtx.taskId, target.iso);
  }

  function reorderTasks(draggedId, targetId, after) {
    const fromIndex = tasks.findIndex(t => t.id === draggedId);
    if (fromIndex === -1) return;
    const [draggedTask] = tasks.splice(fromIndex, 1);
    let toIndex = tasks.findIndex(t => t.id === targetId);
    if (toIndex === -1) {
      tasks.push(draggedTask);
    } else {
      if (after) toIndex += 1;
      tasks.splice(toIndex, 0, draggedTask);
    }
    render();
    save();
  }

  function moveTaskToEnd(draggedId) {
    const fromIndex = tasks.findIndex(t => t.id === draggedId);
    if (fromIndex === -1) return;
    const [draggedTask] = tasks.splice(fromIndex, 1);
    tasks.push(draggedTask);
    render();
    save();
  }

  function setHighlight(id, color) {
    const t = tasks.find(t => t.id === id);
    if (t) t.highlight = color;
    render();
    save();
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      addTask(inputEl.value);
      inputEl.value = '';
    }
  });

  clearBtn.addEventListener('click', () => {
    const removed = tasks.filter(t => t.done);
    if (!removed.length) return;
    tasks = tasks.filter(t => !t.done);
    render();
    save();
    showUndo(removed.length === 1 ? '1 task cleared' : removed.length + ' tasks cleared', () => {
      tasks = tasks.concat(removed);
      render();
      save();
    });
  });

  sortBtn.addEventListener('click', sortByDue);
  sortColorBtn.addEventListener('click', sortByColor);

  loadTheme().then(loadDarkPref);
  loadLegend();
  loadNotifyPref();
  loadEvents();
  load();

  if (window.__setRemoteChangeHandler) {
    window.__setRemoteChangeHandler(() => {
      loadTheme().then(loadDarkPref);
      loadLegend();
      loadNotifyPref();
      loadEvents();
      load();
    });
  }
})();
</script>
</body>
</html>
